
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Exercise 4</title>
  <style>
    table, tr, td {
      border: 1px solid black;
      border-collapse: collapse;
      text-align: center;
      margin: auto;
      padding: 5px;
    }
  </style>
</head>
<body>
  <table width="520" cellspacing="0" cellpadding="0">
    <tr>
      <td width="50%" valign="top">
        <table width="100%" height="180" cellspacing="0" cellpadding="0">
          <tr>
            <td rowspan="2">1</td>
            <td>2</td>
          </tr>
          <tr>
            <td>3</td>
          </tr>
        </table>
      </td>
      <td width="50%" valign="top">
        <table width="100%" height="180" cellspacing="0" cellpadding="0">
          <tr>
            <td>1</td>
            <td rowspan="2">3</td>
          </tr>
          <tr>
            <td>2</td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td valign="top">
        <table width="100%" height="180" cellspacing="0" cellpadding="0">
          <tr>
            <td colspan="2">1</td>
          </tr>
          <tr>
            <td>2</td>
            <td>3</td>
          </tr>
        </table>
      </td>
      <td valign="top">
        <table width="100%" height="180" cellspacing="0" cellpadding="0">
          <tr>
            <td>1</td>
            <td>2</td>
          </tr>
          <tr>
            <td colspan="2">3</td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td valign="top">
        <table width="100%" height="180" cellspacing="0" cellpadding="0">
          <tr>
            <td>1</td>
            <td rowspan="3">4</td>
          </tr>
          <tr>
            <td>2</td>
          </tr>
          <tr>
            <td>3</td>
          </tr>
        </table>
      </td>
      <td valign="top">
        <table width="100%" height="180" cellspacing="0" cellpadding="0">
          <tr>
            <td width="34%" width="34%">2</td>
          </tr>
          <tr>
            <td width="66%">1</td>
            <td width="34%" width="34%">4</td>
          </tr>
          <tr>
            <td width="33%">4</td>
            <td width="33%">5</td>
            <td width="34%">6</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
