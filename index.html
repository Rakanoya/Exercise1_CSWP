<!doctype html>
<html lang="en">
<head>
   <meta charset="utf-8">
   <title>Contact Us</title>
</head>
<body>
   <h1>Contact Us</h1>
   <form method="post" action="https://student2.cs.appstate.edu/crr/3440/homework/h3/contact/">
      <fieldset>
         <legend>Send a Message</legend>
         <label for="emailTo">To:</label>
         <br>
         <input type="text" id="emailTo" name="emailTo" value="webmaster@example.com" readonly><br>
         <label for="emailFrom">From:</label>
         <br>
         <input type="email" id="emailFrom" name="emailFrom" required><br>
         <label for="emailBody">Message:</label>
         <br>
         <textarea id="emailBody" name="emailBody" cols="20" rows="5" placeholder="Type your message here ..." required></textarea><br>
         <label for="referrer">How did you hear about us?</label>
         <br>
         <select id="referrer" name="referrer">
            <option value="google">Google</option>
            <option value="ad">Newspaper ad</option>
            <option value="friend">Friend</option>
            <option value="other">Other</option>
         </select><br>
         <label for="newsletter">Subscribe to our newsletter</label>
         <br>
         <input type="checkbox" id="newsletter" name="newsletter" checked><br>
         <fieldset>
            <legend>Rating</legend>
            <input type="radio" id="rating_1" name="rating" value="1">
            <label for="rating_1">1</label>
            <input type="radio" id="rating_2" name="rating" value="2">
            <label for="rating_2">2</label>
            <input type="radio" id="rating_3" name="rating" value="3">
            <label for="rating_3">3</label>
            <input type="radio" id="rating_4" name="rating" value="4">
            <label for="rating_4">4</label>
            <input type="radio" id="rating_5" name="rating" value="5">
            <label for="rating_5">5</label><br>
         </fieldset>
         <input type="submit" value="Send Message">
      </fieldset>
   </form>
</body>
</html>
