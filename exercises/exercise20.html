<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bananaade Stand</title>
  <link rel="stylesheet" href="../styles/exercise20.css">
  <script defer src="../scripts/exercise20.js"></script>
</head>
<body>
  <h1>The World's BEST Bananaade!</h1>

  <section>
    <h2>Add Ingredients</h2>
    <label for="tbBananas">
      <img src="../images/plus_light.png" alt="Add">
      <span class="clickable">Add bananas</span>
      <input id="tbBananas" class="hide_me" type="text" style="visibility: hidden;">
    </label>

    <label for="tbWater">
      <img src="../images/plus_light.png" alt="Add">
      <span class="clickable">Add gallons of water</span>
      <input id="tbWater" class="hide_me" type="text" style="visibility: hidden;">
    </label>

    <label for="tbSugar">
      <img src="../images/plus_light.png" alt="Add">
      <span class="clickable">Add cups of sugar</span>
      <input id="tbSugar" class="hide_me" type="text" style="visibility: hidden;">
    </label>

    <label for="tbEmptyGlasses">
      <img src="../images/plus_light.png" alt="Add">
      <span class="clickable">Add empty glasses</span>
      <input id="tbEmptyGlasses" class="hide_me" type="text" style="visibility: hidden;">
    </label>
  </section>

  <section>
    <h2>Controls</h2>
    <button id="btnMakeBananaade" type="button">Make Bananaade</button>
    <button id="btnSellBananaade" type="button">Sell Bananaade</button>
  </section>
</body>
</html>
